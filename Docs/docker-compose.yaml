---
services:
  # MariaDB for storing BookStack data.
  mariadb:
    image: lscr.io/linuxserver/mariadb:latest
    container_name: mariadb
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
      - MYSQL_ROOT_PASSWORD=bookstack
      - MYSQL_DATABASE=bookstack
      - MYSQL_USER=bookstack
      - MYSQL_PASSWORD=bookstack
    volumes:
      - ./config/mariadb:/config
    ports:
      - 3306:3306
    restart: unless-stopped

  # BookStack initialization for documentation purposes.
  bookstack:
    image: lscr.io/linuxserver/bookstack:latest
    container_name: bookstack
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
      - APP_URL=http://localhost:6875
      # Generate the APP_KEY using `docker run -it --rm --entrypoint /bin/bash lscr.io/linuxserver/bookstack:latest appkey`
      - APP_KEY=base64:hCEuj34XYLVsT/zx9lSeux6ncatxLkfeuVQRwlSXug4=
      - APP_LANG=en
      - DB_HOST=mariadb
      - DB_PORT=3306
      - DB_USERNAME=bookstack
      - DB_PASSWORD=bookstack
      - DB_DATABASE=bookstack
    volumes:
      - ./config/bookstack:/config
    ports:
      - 6875:80
    restart: unless-stopped
